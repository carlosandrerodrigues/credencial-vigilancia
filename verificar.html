<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B3C8C">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Verificação oficial de credencial funcional da Vigilância Sanitária - Prefeitura Municipal de Taguatinga/TO.">

  <title>Verificação de Credencial | Vigilância Sanitária - Taguatinga/TO</title>

  <!-- Favicon vetorial embutido: nenhum arquivo externo é necessário -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B3C8C'/%3E%3Ccircle cx='50' cy='42' r='16' fill='%23FFC42E'/%3E%3Cpath d='M6 62 Q28 42 50 62 Q72 42 94 62 L94 94 L6 94 Z' fill='%2312864B'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/credencial.css">
</head>
<body>
  <main class="fundo">
    <div class="pagina-verificacao">

      <!-- A credencial é montada aqui pelo JavaScript, a partir do ?id= da URL -->
      <div id="credencial">
        <div class="credencial">
          <div class="carregando">
            <p>Consultando a base oficial…</p>
            <span class="carregando__barra"></span>
            <span class="carregando__barra" style="width:70%;margin-inline:auto"></span>
          </div>
        </div>
      </div>

      <!-- Sem link para o painel: quem escaneia o QR Code não deve ter
           caminho até a área administrativa. -->
      <p class="assinatura-oficial">
        Documento verificado eletronicamente.<br>
        Em caso de dúvida, procure a Vigilância Sanitária Municipal.
      </p>
    </div>
  </main>

  <!-- Ordem obrigatória: núcleo → utilitários → dados → componentes → controlador -->
  <script src="assets/js/core.js"></script>
  <script src="assets/js/format.js"></script>
  <script src="assets/js/icones.js"></script>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/credencial.js"></script>
  <script src="assets/js/verificar.js"></script>
</body>
</html>
